name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install ruff
      - name: ruff check
        run: ruff check whoa_llm tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install base + ML deps (CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov pyyaml \
            torch --index-url https://download.pytorch.org/whl/cpu || true
          python -m pip install \
            "transformers>=4.44" "trl>=0.10" "peft>=0.12" \
            "datasets>=2.20" "accelerate>=0.33" gradio sentencepiece tokenizers
      - name: Run tests (skip GPU + network)
        run: python -m pytest -q -m "not requires_gpu"
