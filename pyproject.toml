[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whoa-llm"
version = "0.1.0"
description = "Local, memory-efficient LLM fine-tuning (SFT/LoRA/QLoRA/GRPO) with a Gradio UI."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Whoa-llm contributors" }]
keywords = ["llm", "fine-tuning", "lora", "qlora", "grpo", "huggingface", "unsloth"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psutil>=5.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
core = [
    "torch>=2.2",
    "transformers>=4.44",
    "datasets>=2.20",
    "accelerate>=0.33",
    "peft>=0.12",
    "trl>=0.10",
    "bitsandbytes>=0.43; platform_system == 'Linux'",
    "sentencepiece>=0.2",
    "safetensors>=0.4",
    "gradio>=4.40",
    "huggingface_hub>=0.24",
]
unsloth = [
    "unsloth; platform_system == 'Linux'",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[project.scripts]
whoa-llm = "whoa_llm.cli:app"

[project.urls]
Repository = "https://github.com/minimoosepiano-bit/whoa-llm"

[tool.setuptools.packages.find]
include = ["whoa_llm*"]
exclude = ["tests*", "examples*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_gpu: test needs a CUDA-capable GPU",
    "requires_network: test downloads from the internet",
]
